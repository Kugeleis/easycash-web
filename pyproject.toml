[project]
name = "easycash-web"
version = "0.3.0"
description = "EasyCash&Tax reimplementation: cash-basis bookkeeping (EÜR) and VAT pre-registration for freelancers and small businesses."
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
authors = [
    { name = "Kugeleis", email = "9948777+Kugeleis@users.noreply.github.com" }
]
dependencies = [
    "fastapi>=0.121.0",
    "pydantic>=2.12.0",
    "uvicorn[standard]>=0.38.0",
    "python-multipart>=0.0.3",
]

[project.scripts]
easycash-web = "easycash_web:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.8.1",
    "httpx>=0.28.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[tool.bumpversion]
# current_version auto-detected from project.version
commit           = true
commit_args      = ""
tag              = true
regex            = true
search           = '^version\s*=\s*"{current_version}"$'
replace          = 'version = "{new_version}"'
allow_dirty      = true
pre_commit_hooks = ["uv sync", "git add uv.lock"]        # The new bit.

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
