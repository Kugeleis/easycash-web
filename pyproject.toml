[project]
name = "easycash-web"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kugeleis", email = "9948777+Kugeleis@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
easycash-web = "easycash_web:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.8.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[tool.bumpversion]
# current_version auto-detected from project.version
commit           = true
commit_args      = ""
tag              = true
regex            = true
search           = '^version\s*=\s*"{current_version}"$'
replace          = 'version = "{new_version}"'
allow_dirty      = true
pre_commit_hooks = ["uv sync", "git add uv.lock"]        # The new bit.

[[tool.bumpversion.files]]
filename = "pyproject.toml"
