<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>EasyCash&Tax Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Web Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Tabulator CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.15.0/dist/css/tabulator.min.css">
    <!-- Main styles -->
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .container { display: flex; flex: 1; }
        .sidebar { width: 250px; padding: 20px; background: #f4f4f4; }
        .main { flex: 1; padding: 20px; overflow-y: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; background: #3498db; color: white; }
        .top-bar select { padding: 8px; }
        .top-bar button { padding: 8px 12px; background: #2ecc71; color: white; border: none; cursor: pointer; }
        .top-bar button:hover { background: #27ae60; }
        .grid-container { height: 600px; border: 1px solid #ddd; margin-bottom: 20px; }
        .calculator { background: #ecf0f1; padding: 15px; border-radius: 5px; }
        .calculator input { width: 100%; padding: 8px; margin: 5px 0; }
        .calculator button { padding: 8px 12px; background: #3498db; color: white; border: none; cursor: pointer; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li { margin: 10px 0; }
        .sidebar a { text-decoration: none; color: #3498db; }
        .sidebar a:hover { text-decoration: underline; }
        .i18n { display: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <select id="client-select" aria-label="Client selection">
            <option value="">Select client...</option>
        </select>
        <button id="new-booking"><i class="fa fa-plus"></i> Neue Buchung</button>
    </div>

    <div class="container">
        <div class="sidebar">
            <ul>
                <li><a href="#" id="nav-client"><i class="fa fa-user"></i> Mandanten</a></li>
                <li><a href="#" id="nav-business"><i class="fa fa-building"></i> Betrieb</a></li>
                <li><a href="#" id="nav-account"><i class="fa fa-cogs"></i> Konten</a></li>
                <li><a href="#" id="nav-booking"><i class="fa fa-file-alt"></i> Buchungen</a></li>
                <li><a href="#" id="nav-calculator"><i class="fa fa-calculator"></i> Rechner</a></li>
            </ul>
        </div>

        <div class="main">
            <div class="grid-container" id="booking-grid"></div>

            <div class="calculator" id="calculator">
                <h3><i class="fa fa-calculator"></i> Rechner</h3>
                <input type="text" id="calc-input" placeholder="Gib einen Betrag ein (z.B. 100+50*1.19)">
                <button id="calc-clear"><i class="fa fa-trash"></i> Löschen</button>
                <button id="calc-eval"><i class="fa fa-check"></i> Berechnen</button>
            </div>
        </div>
    </div>

    <!-- Web Awesome JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
    <!-- Tabulator JS -->
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.15.0/dist/js/tabulator.min.js"></script>
    <!-- Main JS -->
    <script type="module" src="/static/app.js"></script>
</body>
</html>
